<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo de lo Oculto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Archivo de lo Oculto</h1>
    <nav>
      <ul>
        <li><a href="#catalogo">Leyendas</a></li>
        <li><a href="#contacto">Enviar tu leyenda</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section id="catalogo">
      <h2>Catálogo de Leyendas</h2>
      <div class="filtros">
  <button data-categoria="todas">Todas</button>
  <button data-categoria="Aparición">Apariciones</button>
  <button data-categoria="Criatura">Criaturas</button>
  <button data-categoria="Lugar maldito">Lugares malditos</button>
</div>
    </section>

    <section id="contacto">
      <h2>¿Conocés una leyenda? Compartila con nosotros</h2>
      <form id="form-leyenda" novalidate>

  <div class="campo">
    <label for="nombre-usuario">Tu nombre</label>
    <input type="text" id="nombre-usuario" name="nombre-usuario">
    <span class="error" id="error-nombre-usuario"></span>
  </div>

  <div class="campo">
    <label for="email">Tu email</label>
    <input type="email" id="email" name="email">
    <span class="error" id="error-email"></span>
  </div>

  <div class="campo">
    <label for="nombre-leyenda">Nombre de la leyenda</label>
    <input type="text" id="nombre-leyenda" name="nombre-leyenda">
    <span class="error" id="error-nombre-leyenda"></span>
  </div>

  <div class="campo">
    <label for="region">Región de origen</label>
    <input type="text" id="region" name="region">
    <span class="error" id="error-region"></span>
  </div>

  <div class="campo">
    <label for="descripcion">Contanos la leyenda</label>
    <textarea id="descripcion" name="descripcion" rows="4"></textarea>
    <span class="error" id="error-descripcion"></span>
  </div>

  <button type="submit">Enviar leyenda</button>
  <p class="mensaje-exito" id="mensaje-exito"></p>

</form>
    </section>

  </main>

  <footer>
    <p>Archivo de lo Oculto &copy; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
